name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every row must differ in more than one key. Two include entries that
        # differ only in `testbench` get merged by GitHub into a single
        # combination, which silently drops one leg and duplicates another.
        include:
          - { php: '8.2', laravel: 11, filament: '^4.0', testbench: '^9.0' }
          - { php: '8.2', laravel: 12, filament: '^4.0', testbench: '^10.0' }
          - { php: '8.3', laravel: 12, filament: '^4.0', testbench: '^10.0' }
          - { php: '8.3', laravel: 13, filament: '^5.0', testbench: '^11.0' }
          - { php: '8.4', laravel: 13, filament: '^5.0', testbench: '^11.0' }

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Filament ${{ matrix.filament }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          # The local path repository points at ../rating, which does not exist
          # on a runner, so ghanem/rating must resolve from Packagist here.
          composer config --unset repositories
          # Laravel 11 is past its security-support window, so every published
          # release is flagged by Composer's advisory-block policy and none can
          # be selected. This package still targets it, so allow already-published
          # releases through; it does not affect what actually ships.
          composer config policy.advisories.block false --no-interaction
          composer require "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-interaction

      - name: Run tests
        run: vendor/bin/pest
